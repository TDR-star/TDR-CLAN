<style>
  .hero{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

text-align:center;

background:
linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.90)),
url("https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1920&auto=format&fit=crop");

background-size:cover;
background-position:center;
background-repeat:no-repeat;

position:relative;
overflow:hidden;

  }
  .logo{

width:140px;
height:140px;

margin:auto;

display:flex;

align-items:center;
justify-content:center;

font-size:95px;

color:#FFD700;

background:

radial-gradient(
circle,
rgba(255,215,0,.25),
transparent 65%
);

border-radius:50%;

border:2px solid rgba(255,215,0,.5);

box-shadow:

0 0 20px gold,
0 0 50px rgba(255,215,0,.6),
inset 0 0 30px rgba(255,215,0,.3);

animation:crownFloat 3s infinite ease-in-out;

}


.logo span{

text-shadow:

0 0 10px #fff,
0 0 25px gold,
0 0 60px #ffae00;

}



/* لایه نور سینمایی */

.hero::before{

content:"";

position:absolute;

inset:0;


background:

radial-gradient(
circle,
rgba(255,215,0,.18),
transparent 45%
);


animation:

cinematicLight 5s infinite alternate;

}



@keyframes cinematicLight{


from{

opacity:.4;

}


to{

opacity:1;

}


}
.hero-box{
background:rgba(0,0,0,.45);
padding:40px;
border:2px solid gold;
border-radius:25px;
backdrop-filter:blur(8px);
box-shadow:0 0 35px rgba(255,215,0,.35);
max-width:700px;
width:90%;
}

h1{
font-size:64px;
color:#FFD700;
font-family:'Cinzel',serif;
letter-spacing:6px;
}

.tag{
font-size:28px;
margin-top:10px;
color:#fff;
}

.info{
margin-top:25px;
font-size:20px;
line-height:2;
}

.btn{
display:inline-block;
margin-top:30px;
padding:16px 45px;
background:gold;
color:#000;
text-decoration:none;
border-radius:50px;
font-weight:bold;
transition:.3s;
}

.btn:hover{
transform:scale(1.08);
box-shadow:0 0 30px gold;
}

  .section{
padding:80px 20px;
background:#0b0b0b;
}

.title{
text-align:center;
font-size:42px;
color:#FFD700;
font-family:'Cinzel',serif;
margin-bottom:50px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
max-width:1200px;
margin:auto;
}

.card{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,215,0,.25);
border-radius:20px;
padding:30px;
text-align:center;
transition:.35s;
backdrop-filter:blur(6px);
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 0 30px rgba(255,215,0,.45);
border-color:#FFD700;
}

.card h3{
color:#FFD700;
margin-bottom:15px;
font-size:24px;
}

.card p{
line-height:1.8;
color:#ddd;
}

footer{
background:#000;
padding:30px;
text-align:center;
border-top:1px solid rgba(255,215,0,.2);
color:#bbb;
}
/* =========================
   KING EFFECTS
========================= */

body{
    overflow-x:hidden;
}


/* ذرات طلایی */

.particles{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:5;
}


.particle{
    position:absolute;
    width:6px;
    height:6px;
    background:#FFD700;
    border-radius:50%;
    box-shadow:
    0 0 10px gold,
    0 0 25px gold;

    animation:
    moveParticle linear infinite;
}


@keyframes moveParticle{

0%{
    transform:
    translateY(100vh)
    scale(0);

    opacity:0;
}

20%{
    opacity:1;
}

100%{

    transform:
    translateY(-10vh)
    scale(1.5);

    opacity:0;

}

}


/* نور متحرک روی Hero */

.hero-box::before{

content:"";

position:absolute;

top:-50%;
left:-50%;

width:200%;
height:200%;

background:
linear-gradient(
120deg,
transparent,
rgba(255,215,0,.25),
transparent
);

transform:rotate(25deg);

animation:lightMove 5s infinite;


}


.hero-box{

position:relative;
overflow:hidden;

}


@keyframes lightMove{

0%{
transform:translateX(-100%) rotate(25deg);
}


100%{

transform:
translateX(100%)
rotate(25deg);

}

}



/* انیمیشن ورود */

.hero-box,
.card{

animation:
showUp 1s ease;

}


@keyframes showUp{

from{

opacity:0;

transform:
translateY(50px);

}


to{

opacity:1;

transform:
translateY(0);

}

}



/* موبایل */

@media(max-width:700px){


h1{

font-size:45px;

}
}

font-size:65px;

}

}

}

padding:25px;

}

font-size:32px;

/* =========================

========================= */

filter:
drop-shadow(0 0 10px gold)

crownGlow 2s infinite alternate;

drop-shadow(0 0 30px gold)

0 0 10px gold,

animation:
textGlow 3s infinite alternate;

}

from{

0 0 20px gold;

}


to{

text-shadow:

0 0 30px gold,
0 0 80px #ffae00;

/* =========================

0 0 10px #FFD700,
