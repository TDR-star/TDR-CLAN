<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KING CLAN</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
  .hero{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

text-align:center;

background:
linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.90)),
url("https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1920&auto=format&fit=crop");

background-size:cover;
background-position:center;
background-repeat:no-repeat;

position:relative;
overflow:hidden;

  }
  .logo{

width:140px;
height:140px;

margin:auto;

display:flex;

align-items:center;
justify-content:center;

font-size:95px;

color:#FFD700;

background:

radial-gradient(
circle,
rgba(255,215,0,.25),
transparent 65%
);

border-radius:50%;

border:2px solid rgba(255,215,0,.5);

box-shadow:

0 0 20px gold,
0 0 50px rgba(255,215,0,.6),
inset 0 0 30px rgba(255,215,0,.3);

animation:crownFloat 3s infinite ease-in-out;

}


.logo span{

text-shadow:

0 0 10px #fff,
0 0 25px gold,
0 0 60px #ffae00;

}



/* لایه نور سینمایی */

.hero::before{

content:"";

position:absolute;

inset:0;


background:

radial-gradient(
circle,
rgba(255,215,0,.18),
transparent 45%
);


animation:

cinematicLight 5s infinite alternate;

}



@keyframes cinematicLight{


from{

opacity:.4;

}


to{

opacity:1;

}


}
.hero-box{
background:rgba(0,0,0,.45);
padding:40px;
border:2px solid gold;
border-radius:25px;
backdrop-filter:blur(8px);
box-shadow:0 0 35px rgba(255,215,0,.35);
max-width:700px;
width:90%;
z-index:2;
}

h1{
font-size:64px;
color:#FFD700;
font-family:'Cinzel',serif;
letter-spacing:6px;
}

.tag{
font-size:28px;
margin-top:10px;
color:#fff;
}

.info{

margin-top:25px;

font-size:20px;

line-height:2;

color:#ffffff;

font-weight:600;

text-shadow:
0 0 10px #000,
0 0 20px rgba(255,215,0,.8);

}

.btn{
display:inline-block;
margin-top:30px;
padding:16px 45px;
background:gold;
color:#000;
text-decoration:none;
border-radius:50px;
font-weight:bold;
transition:.3s;
}

.btn:hover{
transform:scale(1.08);
box-shadow:0 0 30px gold;
}

  .section{
padding:80px 20px;
background:#0b0b0b;
}

.title{
text-align:center;
font-size:42px;
color:#FFD700;
font-family:'Cinzel',serif;
margin-bottom:50px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
max-width:1200px;
margin:auto;
}

.card{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,215,0,.25);
border-radius:20px;
padding:30px;
text-align:center;
transition:.35s;
backdrop-filter:blur(6px);
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 0 30px rgba(255,215,0,.45);
border-color:#FFD700;
}

.card h3{
color:#FFD700;
margin-bottom:15px;
font-size:24px;
}

.card p{
line-height:1.8;
color:#ddd;
}

footer{
background:#000;
padding:30px;
text-align:center;
border-top:1px solid rgba(255,215,0,.2);
color:#bbb;
}
/* =========================
   KING EFFECTS
========================= */

body{
    overflow-x:hidden;
}


/* ذرات طلایی */

.particles{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:5;
}


.particle{
    position:absolute;
    width:6px;
    height:6px;
    background:#FFD700;
    border-radius:50%;
    box-shadow:
    0 0 10px gold,
    0 0 25px gold;

    animation:
    moveParticle linear infinite;
}


@keyframes moveParticle{

0%{
    transform:
    translateY(100vh)
    scale(0);

    opacity:0;
}

20%{
    opacity:1;
}

100%{

    transform:
    translateY(-10vh)
    scale(1.5);

    opacity:0;

}

}


/* نور متحرک روی Hero */

.hero-box::before{

content:"";

position:absolute;

top:-50%;
left:-50%;

width:200%;
height:200%;

background:
linear-gradient(
120deg,
transparent,
rgba(255,215,0,.25),
transparent
);

transform:rotate(25deg);

animation:lightMove 5s infinite;


}


.hero-box{

position:relative;
overflow:hidden;

}


@keyframes lightMove{

0%{
transform:translateX(-100%) rotate(25deg);
}


100%{

transform:
translateX(100%)
rotate(25deg);

}

}



/* انیمیشن ورود */

.card{

animation:
showUp 1s ease;

}


@keyframes showUp{

from{

opacity:0;

transform:
translateY(50px);

}


to{

opacity:1;

transform:
translateY(0);

}

}



/* موبایل */

@media(max-width:700px){


h1{

font-size:45px;

}


.logo{

font-size:65px;

}


.tag{

font-size:20px;

}


.info{

font-size:16px;

}


.hero-box{

padding:25px;

}


.title{

font-size:32px;

}
}
/* =====================
KING NAVBAR
===================== */


.navbar{

position:fixed;

top:0;
left:0;

width:100%;

height:80px;

display:flex;

justify-content:space-between;

align-items:center;

padding:0 50px;

background:

rgba(0,0,0,.65);

backdrop-filter:blur(10px);

border-bottom:

1px solid rgba(255,215,0,.3);

z-index:100;


}



.nav-logo{

font-family:'Cinzel',serif;

font-size:30px;

color:#FFD700;

text-shadow:

0 0 15px gold;

}



.nav-links{

display:flex;

gap:30px;

}



.nav-links a{

color:white;

text-decoration:none;

font-weight:600;

transition:.3s;

}



.nav-links a:hover{

color:#FFD700;

text-shadow:

0 0 15px gold;

}



@media(max-width:700px){

.navbar{

padding:0 20px;

}

}
.nav-links{

display:none;

}
  
/* =========================
   KING CINEMATIC GLOW
========================= */


.logo{
position:relative;
font-size:100px;

filter:
drop-shadow(0 0 10px gold)
drop-shadow(0 0 25px gold)
drop-shadow(0 0 50px #ffae00);

animation:
crownGlow 2s infinite alternate;

}


@keyframes crownGlow{

from{

filter:
drop-shadow(0 0 10px gold)
drop-shadow(0 0 20px gold);

transform:scale(1);

}


to{

filter:
drop-shadow(0 0 30px gold)
drop-shadow(0 0 70px #ffae00);

transform:scale(1.08);

}

}



.hero h1{

text-shadow:

0 0 10px gold,
0 0 25px gold,
0 0 50px #ffae00;

animation:
textGlow 3s infinite alternate;

}


@keyframes textGlow{


from{

text-shadow:

0 0 10px gold,
0 0 20px gold;

}


to{

text-shadow:

0 0 30px gold,
0 0 80px #ffae00;

}

}


/* حلقه نور پشت تاج */

.logo::after{

content:"";

position:absolute;

width:130px;

height:130px;

border-radius:50%;

background:

radial-gradient(
circle,
rgba(255,215,0,.35),
transparent 70%
);

z-index:-1;
}

/* =========================
KING 3D ENTRANCE ANIMATION
========================= */


.hero-box{

perspective:1000px;

animation:
kingEntrance 1.8s cubic-bezier(.17,.67,.35,1.3) forwards;

opacity:0;

}



.logo{

animation:
crownEntrance 2s ease-out forwards,
crownGlow 3s infinite ease-in-out 2s;

opacity:0;

}



.hero h1{

animation:
titleEntrance 1.8s ease-out .5s forwards;

opacity:0;

}



.tag{

animation:
fadeEntrance 1.5s ease-out 1s forwards;

opacity:0;

}



.info{

animation:
fadeEntrance 1.5s ease-out 1.3s forwards;

opacity:0;

}



.btn{

animation:
buttonEntrance 1.5s ease-out 1.6s forwards;

opacity:0;

}



/* ورود کل پنل */

@keyframes kingEntrance{


0%{

opacity:0;

transform:

translateY(120px)
rotateX(45deg)
scale(.7);

filter:blur(15px);

}


100%{

opacity:1;

transform:

translateY(0)
rotateX(0)
scale(1);

filter:blur(0);

}

}



/* ورود تاج */

@keyframes crownEntrance{


0%{

opacity:0;

transform:

translateY(-120px)
rotateY(180deg)
scale(.2);

}


70%{

transform:

translateY(15px)
rotateY(0)
scale(1.15);

}


100%{

opacity:1;

transform:

translateY(0)
scale(1);

}

}



/* ورود نوشته */

@keyframes titleEntrance{


0%{

opacity:0;

transform:

translateZ(-300px)
scale(.3);

letter-spacing:40px;

}


100%{

opacity:1;

transform:

translateZ(0)
scale(1);

letter-spacing:6px;

}

}



/* متن‌ها */

@keyframes fadeEntrance{


from{

opacity:0;

transform:

translateY(40px);

}


to{

opacity:1;

transform:

translateY(0);

}

}



/* دکمه */

@keyframes buttonEntrance{


0%{

opacity:0;

transform:

scale(.3)
rotateX(90deg);

}


100%{

opacity:1;

transform:

scale(1)
rotateX(0);

}

}

.logo{
animation:
crownEntrance 2s ease forwards,
crownGlow 3s infinite ease-in-out 2s !important;
}
/* تاج سلطنتی سه بعدی */

.logo svg{

filter:
drop-shadow(0 0 8px #fff2a8)
drop-shadow(0 0 25px #FFD700)
drop-shadow(0 0 50px #ff9900);

animation:
royalCrown 4s ease-in-out infinite;

transform-origin:center;

}


@keyframes royalCrown{

0%,100%{

transform:
translateY(0)
rotateY(0deg);

}


50%{

transform:
translateY(-8px)
rotateY(15deg);

}

}


/* درخشش روی خود تاج */

.logo svg path{

stroke-width:7;

  }
</style>
  
</head>

<script>

const particles = document.querySelector(".particles");

for(let i = 0; i < 60; i++){

    let particle = document.createElement("div");

    particle.className = "particle";

    particle.style.left = Math.random() * 100 + "%";

    particle.style.animationDuration =
    (Math.random() * 5 + 5) + "s";
